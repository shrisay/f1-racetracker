{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>RaceTracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <style>
            .nav-item {
                margin: 2px;
            }
        </style>
        {% block style %}{% endblock %}
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <nav class="navbar navbar-expand-lg mx-3">
                <a class="navbar-brand" href="{% url 'index' %}">Home</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarContent">
                    <div>
                        <a class="btn btn-success" href="{% url 'create' 'racer' %}">+ Add Racer</a>
                        <a class="btn btn-success" href="{% url 'create' 'constructor' %}">+ Add Constructor</a>
                        <a class="btn btn-primary" href="{% url 'create' 'competition' %}">+ Create competition</a>
                    </div>
                    <div class="ms-auto d-flex gap-2 justify-content-end">
                        <a class="btn btn-danger" href="{% url 'logout' %}">Logout</a>
                        <button class="btn btn-dark" id="toggle-mode">🌙 Dark Mode</button>
                    </div>
                </div>
            </nav>
        </div>
        <div class="container col-11 mt-5">
            {% block body %}
            {% endblock %}
        </div>
        <script src="{% static 'racetracker/layout.js' %}"></script>
    </body>
</html>
