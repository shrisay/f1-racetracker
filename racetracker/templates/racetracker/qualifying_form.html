{% extends "racetracker/layout.html" %}

{% block body %}
    {% for message in messages %}
    <div class="alert alert-danger">
        {{ message }}
    </div>
    {% endfor %}
    <form method="post">
        {% csrf_token %}
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Position</th>
                        <th>Racer</th>
                    </tr>
                </thead>
                <tbody>
                    {% for position in positions %}
                    <tr>
                        <td>{{ position }}</td>
                        <td>
                            <select name="racer_{{ position }}" class="form-control">
                                <option value="">Select Racer</option>
                                {% for racer in season_racers %}
                                <option value="{{ racer.id }}">{{ racer.racer.name }}{% if racer.constructor %} - {{ racer.constructor.name }}{% endif %}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary">Save Results</button>
            <a href="{% url 'view_race' race.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

{% endblock %}
